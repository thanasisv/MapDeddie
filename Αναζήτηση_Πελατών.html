function normalize(s) {
  return String(s).toLocaleLowerCase('el-GR')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const input = document.getElementById('search');
const results = document.getElementById('results');
const count = document.getElementById('count');

function showResults() {
  const q = normalize(input.value.trim());
  results.innerHTML = '';

  if (!q) {
    count.textContent = 'Πληκτρολόγησε για αναζήτηση...';
    return;
  }

  const words = q.split(/\s+/).filter(Boolean);
  const matches = data.filter(r => {
    const hay = normalize(r.bkx + ' ' + r.text);
    return words.every(w => hay.includes(w));
  });

  count.textContent = matches.length + ' πιθανά αποτελέσματα';

  if (!matches.length) {
    results.innerHTML = '<div class="empty">Δεν βρέθηκαν αποτελέσματα</div>';
    return;
  }

  matches.slice(0, 100).forEach(r => {
    const div = document.createElement('div');
    div.className = 'result';
    div.innerHTML = '<div class="code">BKX ' + esc(r.bkx) + '</div>' +
                    '<div class="text">' + esc(r.text) + '</div>';
    results.appendChild(div);
  });

  if (matches.length > 100) {
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = 'Εμφανίζονται τα πρώτα 100 αποτελέσματα.';
    results.appendChild(more);
  }
}

input.addEventListener('input', showResults);
showResults();
